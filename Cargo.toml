[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["kernel", "apps/studio/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[package]
name = "cad-studio-host"
version = "0.1.0"
description = "CAD Studio desktop host (APP-001)"
authors = ["CAD Studio"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "cad_studio_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
